version: '3.8'

services:
  # MongoDB service
  mongo:
    image: mongo:latest
    container_name: pharmasync-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=rootpassword
    networks:
      - pharmasync-network

  # Backend API service
  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: pharmasync-api
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://root:rootpassword@mongo:27017/pharmasync?authSource=admin
      - JWT_SECRET=your_jwt_secret_key
      - JWT_EXPIRES_IN=7d
    networks:
      - pharmasync-network

  # Frontend client service
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: pharmasync-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - pharmasync-network

networks:
  pharmasync-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
